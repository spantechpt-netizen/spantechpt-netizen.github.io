<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Span Tech CRM — customer, pipeline and quotation management for post-tension contracting.">
  <meta name="theme-color" content="#0a2647">
  <title>Span Tech · سبان تك</title>

  <link rel="icon" href="assets/img/icon.png">
  <link rel="apple-touch-icon" href="assets/img/icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Web fonts are a progressive enhancement: the app falls back to system
       Arabic/Latin faces when the server has no internet access. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div id="root">
    <div class="loading-page">…</div>
  </div>
  <script type="module" src="assets/js/app.js"></script>
  <!-- Installing the app is what puts it in the phone's share sheet, so a
       WhatsApp message can be shared straight into the requests queue. The
       worker itself caches nothing — see sw.js. Registration needs a secure
       context, which localhost and the deployed HTTPS host both are. -->
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => { /* http:// on a LAN address */ });
      });
    }
  </script>
</body>
</html>
