#user  nobody;
worker_processes  auto;
worker_rlimit_nofile 65535; # <<< ADDED

events {
    worker_connections  4096; # <<< MODIFIED
    multi_accept on;         # <<< ADDED
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;
    
    ##################################
    # Header handling (replaces obsolete http2 directives)
    ##################################
    large_client_header_buffers 4 16k; # <<< LAST CHANGE
    keepalive_requests 10000;          # <<< LAST CHANGE

    ##################################
    # TCP performance
    ##################################
    tcp_nopush on;  # <<< LAST CHANGE
    tcp_nodelay on; # <<< LAST CHANGE

    ##################################
    # Compression
    ##################################
    gzip on;                   # <<< ADDED
    gzip_comp_level 5;         # <<< ADDED
    gzip_min_length 1024;      # <<< ADDED
    gzip_types                 # <<< ADDED
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml; 
    
    
    # FIX: Prevent gzip issues with HTTP/2
    
    gzip_proxied any;           # FIX
    gzip_vary on;               # FIX   

    ##################################
    # WebSocket compatibility
    ##################################
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    ##################################
    # Connection protection
    ##################################
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m; # <<< ADDED

    ##################################
    # Rate limiting (PRODUCTION)
    ##################################
    limit_req_zone $binary_remote_addr zone=frontend:20m rate=40r/s;
    limit_req_zone $binary_remote_addr zone=backend:20m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=crm:10m rate=30r/s;      # <<< SPAN TECH CRM

    limit_req_status 429;

    ##################################
    # Proxy header tuning
    ##################################
    proxy_headers_hash_max_size 1024;     # <<< ADDED
    proxy_headers_hash_bucket_size 128;   # <<< ADDED

    ##################################
    # Global security limits
    ##################################
    client_max_body_size 10m;

    ##################################
    # Slow request protection
    ##################################
    client_body_timeout 10s;   # <<< ADDED
    client_header_timeout 10s; # <<< ADDED
    send_timeout 10s;          # <<< ADDED

    ##################################
    # Block obvious scanners
    ##################################
    map $http_user_agent $bad_bot {         # <<< ADDED
        default 0;
        ~*(nikto|sqlmap|nmap|masscan|dirbuster|acunetix|wpscan|zgrab|crawler) 1;
    }

    ##################################
    # Additional sites, one file each (crm.spantechpt.com lives here)
    ##################################
    include conf.d/*.conf;                                             # <<< SPAN TECH CRM

    ##################################
    # HTTP (ACME + redirect)
    ##################################
    server {
        listen 80;
        server_name app.spantechpt.com;

        location /.well-known/acme-challenge/ {
            root C:/win-acme/wwwroot;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    ##################################
    # HTTPS (PROXY ONLY)
    ##################################
    server {
        listen 443 ssl; 
        http2 off;   
        server_name app.spantechpt.com;

        ssl_certificate      C:/nginx/ssl/app.spantechpt.com-chain.pem;
        ssl_certificate_key  C:/nginx/ssl/app.spantechpt.com-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        add_header X-Frame-Options SAMEORIGIN always; # <<< ADDED
        add_header X-Content-Type-Options nosniff always; # <<< ADDED
        add_header Referrer-Policy strict-origin-when-cross-origin always; # <<< ADDED
        add_header X-XSS-Protection "1; mode=block" always; # <<< ADDED

        ##################################
        # Block known scanning bots
        ##################################
        if ($bad_bot) { return 403; } # <<< ADDED

        ##################################
        # Block dangerous HTTP methods
        ##################################
        if ($request_method !~ ^(GET|POST|HEAD|PUT|DELETE|OPTIONS)$) { # <<< MODIFIED
            return 444;
        }

        ##################################
        # Block executable / upload payloads
        ##################################
        location ~* \.(exe|dll|bat|cmd|ps1|vbs|jar|bin|sh|php|asp|aspx)$ {
            return 444;
        }

        ##################################
        # Block traversal & RCE patterns
        ##################################
        if ($request_uri ~* "(\\.\.|%2e%2e|cmd=|exec=|powershell|pwsh|wget|curl|bash)") {
            return 444;
        }

        ##################################
        # Protect hidden files
        ##################################
        location ~ /\.(?!well-known).* {
            deny all;
        }

        ##################################
        # Next.js static assets
        ##################################
        location ^~ /_next/static/ {
            limit_req zone=frontend burst=200 nodelay;

            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";  # FIX
        }

        ##################################
        # Backend APIs + SignalR
        ##################################
        location /backend/ {
            limit_req zone=backend burst=60 nodelay;
            limit_conn conn_limit 20; # <<< ADDED

            proxy_pass http://127.0.0.1:8080/;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s; # <<< ADDED
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            proxy_buffering off;   # safer for APIs
            # proxy_buffering on;
            # proxy_buffers 16 32k;
            # proxy_buffer_size 64k;
        }

        ##################################
        # Next.js frontend
        ##################################
        location / {
            limit_req zone=frontend burst=100 nodelay;

            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            add_header Cache-Control "no-store";   # CRITICAL FIX
        }
    }
}
