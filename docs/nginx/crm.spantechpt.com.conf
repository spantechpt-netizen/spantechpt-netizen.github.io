##################################
# crm.spantechpt.com — Span Tech CRM (Node on 127.0.0.1:8090)
# Stage 2: full site, after the certificate exists in C:/nginx/ssl.
##################################
server {
    listen 80;
    server_name crm.spantechpt.com;

    # Same validation folder win-acme already uses for app.spantechpt.com
    location /.well-known/acme-challenge/ {
        root C:/win-acme/wwwroot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

##################################
# HTTPS (PROXY ONLY)
##################################
server {
    listen 443 ssl;
    http2 off;                       # same as app.spantechpt.com; SSE runs fine on HTTP/1.1
    server_name crm.spantechpt.com;

    ssl_certificate      C:/nginx/ssl/crm.spantechpt.com-chain.pem;
    ssl_certificate_key  C:/nginx/ssl/crm.spantechpt.com-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Uploaded drawings (study) go up to 20 MB; overrides the global 10m
    client_max_body_size 20m;

    if ($bad_bot) { return 403; }

    # The CRM uses PATCH as well, so the method list is wider than app.spantechpt.com's
    if ($request_method !~ ^(GET|POST|HEAD|PUT|PATCH|DELETE|OPTIONS)$) {
        return 444;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    ##################################
    # Live updates (Server-Sent Events): one long-lived connection per tab.
    # No buffering, no rate limit, and timeouts longer than the 25 s heartbeat
    # (the global send_timeout of 10 s would otherwise cut the stream).
    ##################################
    location = /api/events {
        limit_conn conn_limit 20;

        proxy_pass          http://127.0.0.1:8090;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        proxy_set_header    Connection        "";
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
        send_timeout        1h;
        gzip                off;
    }

    ##################################
    # Everything else: the app and its API
    ##################################
    location / {
        limit_req zone=crm burst=100 nodelay;

        proxy_pass          http://127.0.0.1:8090;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }
}
